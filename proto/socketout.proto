import "google/protobuf/empty.proto";
package socketout;

service SocketOut {
    rpc register_user(RegisterRequest) returns (google.protobuf.Empty) {}

    rpc login_user(LoginRequest) returns (google.protobuf.Empty) {} 

    rpc subscribe_messages(LoginRequest) returns (stream MessageResponse) {}

    rpc subscribe_channels(LoginRequest) returns (stream ChannelResponse) {}

    rpc create_channel(CreateChannelRequest) returns (google.protobuf.Empty) {}

    rpc send_message(SendMessageRequest) returns (google.protobuf.Empty) {}

    rpc delete_message(DeleteMessageRequest) returns (google.protobuf.Empty) {}

    rpc delete_account(DeleteAccountRequest) returns (DeleteAccountResponse) {}

    rpc list_accounts(ListAccountsRequest) returns (ListAccountResponse) {}
}

message RegisterRequest {
    required string username = 1;
    required string display_name = 2;
    required string password = 3;
}

message LoginRequest {
    required string username = 1;
    required string password = 2;
}

message LoginResponse {
    required User user = 1;
}

message MessageResponse {
    required Operation type = 1;
    required Message msg = 2;
}

message ChannelResponse {
    required Operation type = 1;
    required Channel channel = 2;
}

message CreateChannelRequest {
    required string channel_name = 1;
    repeated string members = 2;
}

message SendMessageRequest {
    required string sender_id = 1;
    required string channel_id = 2;
    required string data = 3;
}

message DeleteMessageRequest {
    required string channel_id = 1;
    required int64 message_id = 2;
}

message DeleteAccountRequest {
    required string username = 1;
    required string password = 2;
}

message DeleteAccountResponse {
    required User user = 1;
}

message ListAccountsRequest {
    required string regex = 1;
}

message ListAccountResponse {
   repeated User users = 1;
}

message User {
    required string uuid = 1;
    required string username = 2;
    required string display_name = 3;
    required string profile_picture = 4;
}

message Channel {
    required string uuid = 1;
    required string channel_name = 2;
    repeated string user_ids = 3;
    repeated uint64 message_snowflakes = 4;
}

message Message {
    required string sender_id = 1;
    required string channel_id = 2;
    required uint64 snowflake = 3;
    required uint64 created_at = 4;
    required uint64 modified_at = 5;
    required string text = 6;
    repeated string read_by = 7;
}

enum Operation {
    CREATE = 0;
    DELETE = 1;
}